                      if (cs != null) text = cs.toString().trim();
                  }
                  try {
                      JSONObject ev = new JSONObject();
                      ev.put("nid", nid);
                      ev.put("kind", kind == null ? "" : kind);
                      ev.put("act", act == null ? "" : act);
                      if (text != null) ev.put("text", text);
                      ev.put("at", System.currentTimeMillis());
                      WatchBridge.enqueue(c, ev);
                  } catch (Exception e) {
                      return;
                  }
                  // 앱이 반영하기 전에 알림부터 고쳐 둡니다 (워치에서 눌렀다는 표시)
                  JSONObject o = WatchBridge.saved(c, nid);
                  if (o != null) {
                      try {
                          o.put("silent", true);
                          if (text != null && text.length() > 0) {
                              o.put("text", "넣었습니다 · " + text);
                          } else if (act != null && act.startsWith("done:")) {
                              int k = Integer.parseInt(act.substring(5));
                              JSONArray lines = o.optJSONArray("lines");
                              if (lines != null && k >= 0 && k < lines.length()) {
                                  String l = lines.optString(k);
                                  if (!l.startsWith("✅")) lines.put(k, "✅ " + l.replaceFirst("^\\\\S+\\\\s", ""));
                              }
                              JSONArray acts = o.optJSONArray("actions");
                              JSONArray keep = new JSONArray();
                              if (acts != null) for (int x = 0; x < acts.length(); x++) {
                                  JSONObject a = acts.optJSONObject(x);
                                  if (a != null && !act.equals(a.optString("id"))) keep.put(a);
                              }
                              o.put("actions", keep);
                          } else if ("pause".equals(act)) {
                              o.put("text", "잠시 멈춤을 보냈습니다");
                              o.put("chrono", 0L);
                          } else if (act != null && act.startsWith("rate:")) {
                              o.put("text", "집중도 " + act.substring(5) + "%를 보냈습니다");
                              o.put("actions", new JSONArray());
                          } else if ("finish".equals(act)) {
                              o.put("text", "끝내기를 보냈습니다 · 앱에서 집중도를 매기십시오");
                              o.put("actions", new JSONArray());
                              o.put("chrono", 0L);
                          }
                          WatchBridge.post(c, o);
                      } catch (Exception e) {
                          // 표시만 못 고친 것이므로 무시
                      }
                  }
                  WatchBridge.ping();
              }
          }
