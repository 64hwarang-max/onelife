name: 일일일생 APK 만들기
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html 확인
        run: test -f index.html || (echo "index.html 파일이 저장소에 없습니다. 먼저 올려 주세요." && exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 프로젝트 준비
        run: |
          mkdir -p www && cp index.html www/index.html
          sed -i "s/__BUILD__/#${GITHUB_RUN_NUMBER} $(TZ=Asia/Seoul date +%m.%d_%H:%M)/" www/index.html
          cat > package.json <<'J'
          {"name":"ililsaeng","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^7.0.0","@capacitor/app":"^7.0.0","@capacitor/core":"^7.0.0","@capacitor-community/speech-recognition":"^7.0.1","@capacitor-community/media":"^8.0.1","@ebarooni/capacitor-calendar":"^7.2.0","@capacitor/filesystem":"^7.0.0","@capacitor/local-notifications":"^7.0.0","@capacitor/share":"^7.0.0"},
           "devDependencies":{"@capacitor/cli":"^7.0.0"}}
          J
          cat > capacitor.config.json <<'J'
          {"appId":"kr.ililsaeng.app","appName":"일일일생","webDir":"www"}
          J
          npm install
          npx cap add android
      - name: 권한 설정
        run: |
          node -e '
          const fs=require("fs");const p="android/app/src/main/AndroidManifest.xml";let x=fs.readFileSync(p,"utf8");
          for(const n of ["RECORD_AUDIO","POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","RECEIVE_BOOT_COMPLETED","CAMERA","WAKE_LOCK","READ_CALENDAR","WRITE_CALENDAR"]){const f="android.permission."+n;if(!x.includes(f))x=x.replace("</manifest>","    <uses-permission android:name=\""+f+"\" />\n</manifest>")}
          if(!x.includes("WRITE_EXTERNAL_STORAGE"))x=x.replace("</manifest>","    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />\n</manifest>");if(!x.includes("android.speech.RecognitionService"))x=x.replace("</manifest>","    <queries><intent><action android:name=\"android.speech.RecognitionService\" /></intent></queries>\n</manifest>");
          fs.writeFileSync(p,x);console.log("권한 추가 완료")'
          npx cap sync android
      - name: 앱 아이콘 (일일일생 · 지평선 위 해)
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/mipmap-anydpi-v26 $R/values
          cat > $R/drawable/ic_ililsaeng_fg.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#F5B942" android:pathData="M37,60 A17,17 0 0,1 71,60 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M30,63 h48 v4 h-48 z"/>
            <path android:fillColor="#9FB4EE" android:pathData="M40,73 h28 v3 h-28 z"/>
            <path android:fillColor="#F5B942" android:pathData="M53,34 h2 v8 h-2 z M36.5,41 l1.4,-1.4 5.7,5.7 -1.4,1.4 z M71.5,41 l-1.4,-1.4 -5.7,5.7 1.4,1.4 z"/>
          </vector>
          XML
          for f in ic_launcher ic_launcher_round; do cat > $R/mipmap-anydpi-v26/$f.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ili_bg"/>
            <foreground android:drawable="@drawable/ic_ililsaeng_fg"/>
          </adaptive-icon>
          XML
          done
          cat > $R/values/ili_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ili_bg">#23397A</color></resources>
          XML
          echo "아이콘 적용 완료"
      - name: 홈 화면 위젯 추가
        run: |
          cat > add-widget.js <<'WJS'
          // 홈 화면 위젯 '오늘 한눈에' 추가 (Capacitor 안드로이드 프로젝트에 네이티브 코드 생성)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId, label=(cfg.appName||'앱')+' 오늘';
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const res='android/app/src/main/res';
          fs.mkdirSync(javaDir,{recursive:true});['layout','xml','drawable'].forEach(d=>fs.mkdirSync(path.join(res,d),{recursive:true}));
          fs.writeFileSync(path.join(javaDir,'MainActivity.java'),`package ${pkg};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(WidgetBridge.class);
                  super.onCreate(savedInstanceState);
              }
          }
          `);
          fs.writeFileSync(path.join(javaDir,'WidgetBridge.java'),`package ${pkg};

          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "WidgetBridge")
          public class WidgetBridge extends Plugin {
              @PluginMethod
              public void update(PluginCall call) {
                  Context ctx = getContext();
                  String data = call.getString("data", "{}");
                  ctx.getSharedPreferences("widget", Context.MODE_PRIVATE).edit().putString("data", data).apply();
                  AppWidgetManager m = AppWidgetManager.getInstance(ctx);
                  int[] ids = m.getAppWidgetIds(new ComponentName(ctx, TodayWidget.class));
                  for (int id : ids) TodayWidget.render(ctx, m, id);
                  call.resolve();
              }
          }
          `);
          fs.writeFileSync(path.join(javaDir,'TodayWidget.java'),`package ${pkg};

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONObject;

          public class TodayWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager m, int[] ids) {
                  for (int id : ids) render(ctx, m, id);
              }

              static void render(Context ctx, AppWidgetManager m, int id) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_today);
                  String title = "오늘";
                  String body = "앱을 한 번 열면 오늘 할 일이 여기에 표시됩니다.";
                  String foot = "";
                  try {
                      JSONObject o = new JSONObject(ctx.getSharedPreferences("widget", Context.MODE_PRIVATE).getString("data", "{}"));
                      String today = new SimpleDateFormat("yyyy-MM-dd", Locale.KOREA).format(new Date());
                      if (o.has("date") && !today.equals(o.optString("date"))) {
                          title = "새로운 하루";
                          body = "눌러서 오늘의 계획을 시작하십시오.";
                          foot = "";
                      } else if (o.has("title")) {
                          title = o.optString("title", title);
                          body = o.optString("body", body);
                          foot = o.optString("foot", "");
                      }
                  } catch (Exception e) {
                      // 기본 문구 유지
                  }
                  v.setTextViewText(R.id.w_title, title);
                  v.setTextViewText(R.id.w_body, body);
                  v.setTextViewText(R.id.w_foot, foot);
                  Intent i = new Intent(ctx, MainActivity.class);
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  v.setOnClickPendingIntent(R.id.w_root, pi);
                  m.updateAppWidget(id, v);
              }
          }
          `);
          fs.writeFileSync(path.join(res,'drawable/widget_bg.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#F7FFFFFF" />
              <corners android:radius="18dp" />
          </shape>
          `);
          fs.writeFileSync(path.join(res,'layout/widget_today.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="14dp"
              android:background="@drawable/widget_bg">
              <TextView
                  android:id="@+id/w_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#23397A"
                  android:textSize="15sp"
                  android:textStyle="bold"
                  android:maxLines="1" />
              <TextView
                  android:id="@+id/w_body"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="6dp"
                  android:textColor="#1D2430"
                  android:textSize="13sp"
                  android:lineSpacingExtra="3dp" />
              <TextView
                  android:id="@+id/w_foot"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textColor="#646C78"
                  android:textSize="11sp"
                  android:maxLines="2" />
          </LinearLayout>
          `);
          fs.writeFileSync(path.join(res,'xml/widget_today_info.xml'),`<?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="80dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_today"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          `);
          const mp='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(mp,'utf8');
          if(!x.includes('.TodayWidget')){x=x.replace('</application>',`        <receiver android:name=".TodayWidget" android:exported="false" android:label="${label}">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_today_info" />
                  </receiver>
              </application>`)}
          fs.writeFileSync(mp,x);console.log('위젯 추가 완료:',pkg);
          WJS
          node add-widget.js
      - name: 달력 위젯 추가 (일간·주간·월간)
        run: |
          cat > add-calwidget.js <<'CJS'
          // 홈 화면 달력 위젯 (일간·주간·월간) 추가
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId,name=cfg.appName||'앱';
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const res='android/app/src/main/res';
          ['layout','xml','drawable'].forEach(d=>fs.mkdirSync(path.join(res,d),{recursive:true}));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg));
          W('CalBridge.java',`package __PKG__;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.util.Base64;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "CalBridge")
          public class CalBridge extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String kind = call.getString("kind", "day");
                  int base = call.getInt("base", 0);
                  JSArray items = call.getArray("items");
                  if (items == null) { call.reject("items"); return; }
                  try {
                      Context ctx = getContext();
                      File dir = new File(ctx.getFilesDir(), "widget");
                      if (!dir.exists()) dir.mkdirs();
                      JSONArray meta = new JSONArray();
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.getJSONObject(i);
                          byte[] b = Base64.decode(it.getString("img"), Base64.DEFAULT);
                          FileOutputStream fo = new FileOutputStream(new File(dir, kind + "_" + i + ".png"));
                          fo.write(b);
                          fo.close();
                          JSONObject m = new JSONObject();
                          m.put("title", it.optString("title"));
                          m.put("date", it.optString("date"));
                          m.put("start", it.optString("start"));
                          m.put("end", it.optString("end"));
                          meta.put(m);
                      }
                      SharedPreferences p = CalWidget.prefs(ctx);
                      boolean follow = p.getBoolean(kind + "_follow", true);
                      int idx = p.getInt(kind + "_idx", -1);
                      SharedPreferences.Editor e = p.edit().putString(kind + "_meta", meta.toString()).putInt(kind + "_base", base);
                      if (follow || idx < 0 || idx >= items.length()) e.putInt(kind + "_idx", base);
                      e.apply();
                      CalWidget.refreshAll(ctx, kind);
                      call.resolve();
                  } catch (Exception ex) {
                      call.reject("위젯 저장 실패: " + ex.getMessage());
                  }
              }

              @PluginMethod
              public void sizes(PluginCall call) {
                  SharedPreferences p = CalWidget.prefs(getContext());
                  JSObject r = new JSObject();
                  for (String k : new String[] { "day", "week", "month" }) {
                      JSObject o = new JSObject();
                      o.put("w", p.getInt(k + "_w", 0));
                      o.put("h", p.getInt(k + "_h", 0));
                      r.put(k, o);
                  }
                  call.resolve(r);
              }
          }
          `);
          W('CalWidget.java',`package __PKG__;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ResolveInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public abstract class CalWidget extends AppWidgetProvider {
              public static final String NAV = "__PKG__.CALW_NAV";

              protected abstract String kind();

              static Class<?> cls(String k) {
                  if ("week".equals(k)) return WeekCalWidget.class;
                  if ("month".equals(k)) return MonthCalWidget.class;
                  return DayCalWidget.class;
              }

              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("calw", Context.MODE_PRIVATE);
              }

              static JSONArray meta(SharedPreferences p, String k) {
                  try {
                      return new JSONArray(p.getString(k + "_meta", "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static String today() {
                  return new SimpleDateFormat("yyyy-MM-dd", Locale.KOREA).format(new Date());
              }

              public static void refreshAll(Context c, String k) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  int[] ids = m.getAppWidgetIds(new ComponentName(c, cls(k)));
                  for (int id : ids) render(c, m, id, k);
              }

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  followToday(c, kind());
                  for (int id : ids) {
                      saveSize(c, kind(), m.getAppWidgetOptions(id));
                      render(c, m, id, kind());
                  }
              }

              @Override
              public void onAppWidgetOptionsChanged(Context c, AppWidgetManager m, int id, Bundle o) {
                  saveSize(c, kind(), o);
                  render(c, m, id, kind());
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  super.onReceive(c, i);
                  if (!NAV.equals(i.getAction()) || !kind().equals(i.getStringExtra("kind"))) return;
                  int d = i.getIntExtra("d", 0);
                  SharedPreferences p = prefs(c);
                  int n = meta(p, kind()).length();
                  if (n == 0) return;
                  if (d == 0) {
                      followToday(c, kind());
                  } else {
                      int idx = Math.max(0, Math.min(n - 1, p.getInt(kind() + "_idx", 0) + d));
                      p.edit().putInt(kind() + "_idx", idx).putBoolean(kind() + "_follow", false).apply();
                  }
                  refreshAll(c, kind());
              }

              static void saveSize(Context c, String k, Bundle o) {
                  if (o == null) return;
                  int w = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
                  int h = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
                  if (w > 0 && h > 0) prefs(c).edit().putInt(k + "_w", w).putInt(k + "_h", h).apply();
              }

              static void followToday(Context c, String k) {
                  SharedPreferences p = prefs(c);
                  JSONArray meta = meta(p, k);
                  String t = today();
                  int idx = p.getInt(k + "_base", 0);
                  for (int i = 0; i < meta.length(); i++) {
                      JSONObject m = meta.optJSONObject(i);
                      if (m != null && t.compareTo(m.optString("start")) >= 0 && t.compareTo(m.optString("end")) <= 0) {
                          idx = i;
                          break;
                      }
                  }
                  p.edit().putInt(k + "_idx", idx).putBoolean(k + "_follow", true).apply();
              }

              static PendingIntent nav(Context c, String k, int d, int id) {
                  Intent i = new Intent(c, cls(k));
                  i.setAction(NAV);
                  i.putExtra("kind", k);
                  i.putExtra("d", d);
                  return PendingIntent.getBroadcast(c, id * 10 + d + 5, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static PendingIntent open(Context c, String v, String date, int rc) {
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("calw://open?v=" + v + "&d=" + date));
                  i.setClass(c, MainActivity.class);
                  i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(c, rc, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void grant(Context c, Uri u) {
                  try {
                      Intent h = new Intent(Intent.ACTION_MAIN);
                      h.addCategory(Intent.CATEGORY_HOME);
                      List<ResolveInfo> l = c.getPackageManager().queryIntentActivities(h, 0);
                      for (ResolveInfo ri : l) c.grantUriPermission(ri.activityInfo.packageName, u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  } catch (Exception e) {
                      // 무시
                  }
              }

              static void render(Context c, AppWidgetManager m, int id, String k) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_cal);
                  SharedPreferences p = prefs(c);
                  JSONArray meta = meta(p, k);
                  String date = today();
                  boolean shown = false;
                  if (meta.length() > 0) {
                      int idx = Math.max(0, Math.min(meta.length() - 1, p.getInt(k + "_idx", 0)));
                      JSONObject mo = meta.optJSONObject(idx);
                      if (mo != null) {
                          v.setTextViewText(R.id.cw_title, mo.optString("title"));
                          date = mo.optString("date", date);
                      }
                      File f = new File(new File(c.getFilesDir(), "widget"), k + "_" + idx + ".png");
                      if (f.exists()) {
                          try {
                              Uri u = FileProvider.getUriForFile(c, c.getPackageName() + ".calwidget", f).buildUpon()
                                  .appendQueryParameter("v", String.valueOf(f.lastModified())).build();
                              grant(c, u);
                              v.setImageViewUri(R.id.cw_img, u);
                              shown = true;
                          } catch (Exception e) {
                              shown = false;
                          }
                      }
                  } else {
                      v.setTextViewText(R.id.cw_title, "week".equals(k) ? "주간" : "month".equals(k) ? "월간" : "일간");
                  }
                  v.setViewVisibility(R.id.cw_img, shown ? View.VISIBLE : View.GONE);
                  v.setViewVisibility(R.id.cw_empty, shown ? View.GONE : View.VISIBLE);
                  v.setOnClickPendingIntent(R.id.cw_prev, nav(c, k, -1, id));
                  v.setOnClickPendingIntent(R.id.cw_next, nav(c, k, 1, id));
                  v.setOnClickPendingIntent(R.id.cw_today, nav(c, k, 0, id));
                  v.setOnClickPendingIntent(R.id.cw_title, nav(c, k, 0, id));
                  v.setOnClickPendingIntent(R.id.cw_img, open(c, k, date, id * 100 + 1));
                  v.setOnClickPendingIntent(R.id.cw_empty, open(c, k, date, id * 100 + 2));
                  v.setOnClickPendingIntent(R.id.cw_add, open(c, "add", date, id * 100 + 3));
                  v.setOnClickPendingIntent(R.id.cw_open, open(c, k, today(), id * 100 + 4));
                  m.updateAppWidget(id, v);
              }
          }
          `);
          for(const [c,k] of [['DayCalWidget','day'],['WeekCalWidget','week'],['MonthCalWidget','month']])W(c+'.java',`package __PKG__;

          public class ${c} extends CalWidget {
              @Override
              protected String kind() {
                  return "${k}";
              }
          }
          `);
          W('CalFileProvider.java',`package __PKG__;

          import androidx.core.content.FileProvider;

          public class CalFileProvider extends FileProvider {
          }
          `);
          const R=(f,s)=>fs.writeFileSync(path.join(res,f),s);
          R('drawable/cal_bg.xml',`<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FF1C1C1E" />
              <corners android:radius="18dp" />
          </shape>
          `);
          const btn=(id,t,w)=>`        <TextView
                      android:id="@+id/${id}"
                      android:layout_width="${w||'44dp'}"
                      android:layout_height="match_parent"
                      android:gravity="center"
                      android:text="${t}"
                      android:textColor="#FFFFFFFF"
                      android:textSize="20sp" />
          `;
          R('layout/widget_cal.xml',`<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/cw_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@drawable/cal_bg">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="40dp"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingLeft="12dp"
                  android:paddingRight="4dp">
                  <TextView
                      android:id="@+id/cw_title"
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
