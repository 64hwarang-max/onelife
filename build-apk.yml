          node add-focus.js
      - name: 다른 앱 차단 추가 (집중 중 고른 앱을 열면 홈으로)
        run: |
          cat > add-block.js <<'BXJ'
          // 집중 앱 차단: 접근성 서비스가 선택한 앱이 앞에 나오는 순간 홈 화면으로 돌려보냅니다 (화면 내용은 읽지 않음)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId;
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const res='android/app/src/main/res';
          ['xml','values'].forEach(d=>fs.mkdirSync(path.join(res,d),{recursive:true}));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg));
          W('AppBlockService.java',`package __PKG__;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;
          import java.util.Set;

          public class AppBlockService extends AccessibilityService {
              private long lastHit = 0L;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
                  if (e == null || e.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  CharSequence cs = e.getPackageName();
                  if (cs == null) return;
                  String pkg = cs.toString();
                  if (pkg.equals(getPackageName())) return;
                  SharedPreferences p = getSharedPreferences("appblock", Context.MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  long until = p.getLong("until", 0L);
                  if (until <= now) return;
                  Set<String> set = p.getStringSet("pkgs", null);
                  if (set == null || !set.contains(pkg)) return;
                  if (now - lastHit < 700L) return;
                  lastHit = now;
                  performGlobalAction(GLOBAL_ACTION_HOME);
                  long left = Math.max(1L, (until - now + 59999L) / 60000L);
                  Toast.makeText(this, "집중 중입니다 · 약 " + left + "분 남음", Toast.LENGTH_SHORT).show();
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Intent i = new Intent(AppBlockService.this, MainActivity.class);
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                              startActivity(i);
                          } catch (Exception ex) {
                              // 홈 화면으로만 돌려보냄
                          }
                      }
                  }, 300L);
              }

              @Override
              public void onInterrupt() {
              }
          }
          `);
          W('BlockBridge.java',`package __PKG__;

