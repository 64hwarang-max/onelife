          @CapacitorPlugin(name = "BlockBridge")
          public class BlockBridge extends Plugin {
              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences("appblock", Context.MODE_PRIVATE);
              }

              private boolean accessOn() {
                  try {
                      String s = Settings.Secure.getString(getContext().getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      if (s == null) return false;
                      return s.contains(getContext().getPackageName() + "/") && s.contains("AppBlockService");
                  } catch (Exception e) {
                      return false;
                  }
              }

              @PluginMethod
              public void status(PluginCall call) {
                  long until = prefs().getLong("until", 0L);
                  JSObject r = new JSObject();
                  r.put("access", accessOn());
                  r.put("on", until > System.currentTimeMillis());
                  r.put("until", until);
                  call.resolve(r);
              }

              @PluginMethod
              public void askAccess(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              private void skipHandlers(Set<String> skip, PackageManager pm, Intent it) {
                  List<ResolveInfo> l = pm.queryIntentActivities(it, 0);
                  for (ResolveInfo ri : l) {
                      if (ri.activityInfo != null) skip.add(ri.activityInfo.packageName);
                  }
              }

              @PluginMethod
              public void listApps(PluginCall call) {
                  try {
                      PackageManager pm = getContext().getPackageManager();
                      Intent main = new Intent(Intent.ACTION_MAIN);
                      main.addCategory(Intent.CATEGORY_LAUNCHER);
                      List<ResolveInfo> l = pm.queryIntentActivities(main, 0);
                      Set<String> skip = new HashSet<String>();
                      skip.add(getContext().getPackageName());
                      skip.add("com.android.settings");
                      skip.add("com.android.systemui");
                      skip.add("com.android.phone");
                      skip.add("com.android.dialer");
                      skip.add("com.google.android.dialer");
                      skip.add("com.samsung.android.dialer");
                      skip.add("com.samsung.android.incallui");
                      skip.add("com.android.emergency");
                      Intent home = new Intent(Intent.ACTION_MAIN);
                      home.addCategory(Intent.CATEGORY_HOME);
                      skipHandlers(skip, pm, home);
                      skipHandlers(skip, pm, new Intent(Intent.ACTION_DIAL));
                      final List<String[]> out = new ArrayList<String[]>();
                      Set<String> seen = new HashSet<String>();
                      for (ResolveInfo ri : l) {
                          if (ri.activityInfo == null) continue;
                          String p = ri.activityInfo.packageName;
                          if (skip.contains(p) || seen.contains(p)) continue;
                          seen.add(p);
                          boolean game = false;
                          if (Build.VERSION.SDK_INT >= 26 && ri.activityInfo.applicationInfo != null) {
                              game = ri.activityInfo.applicationInfo.category == ApplicationInfo.CATEGORY_GAME;
                          }
                          out.add(new String[] { p, String.valueOf(ri.loadLabel(pm)), game ? "1" : "0" });
                      }
                      Collections.sort(out, new Comparator<String[]>() {
                          @Override
                          public int compare(String[] a, String[] b) {
                              return a[1].compareToIgnoreCase(b[1]);
                          }
                      });
                      JSArray arr = new JSArray();
                      for (String[] a : out) {
                          JSObject o = new JSObject();
                          o.put("pkg", a[0]);
                          o.put("name", a[1]);
                          o.put("game", "1".equals(a[2]));
                          arr.put(o);
                      }
                      JSObject r = new JSObject();
                      r.put("apps", arr);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void start(PluginCall call) {
                  JSArray arr = call.getArray("pkgs");
                  Double u = call.getDouble("until");
                  if (arr == null || u == null) {
                      call.reject("pkgs와 until이 필요합니다.");
                      return;
                  }
                  long now = System.currentTimeMillis();
                  long until = Math.min((long) u.doubleValue(), now + 6L * 3600L * 1000L);
                  Set<String> set = new HashSet<String>();
                  for (int i = 0; i < arr.length(); i++) {
                      String s = arr.optString(i, "");
                      if (s.length() > 0) set.add(s);
                  }
                  prefs().edit().putStringSet("pkgs", set).putLong("until", until).apply();
                  JSObject r = new JSObject();
                  r.put("ok", true);
                  r.put("access", accessOn());
                  r.put("until", until);
                  call.resolve(r);
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  prefs().edit().putLong("until", 0L).apply();
                  call.resolve();
              }
          }
