      - name: 떠 있는 오늘 버튼 추가
        run: |
          cat > add-float.js <<'FJS'
          // 떠 있는 '오늘' 버튼 (다른 앱 위 표시)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId,name=cfg.appName||'앱';
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg).replace(/__NAME__/g,name));
          W('FloatBridge.java',`package __PKG__;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "FloatBridge")
          public class FloatBridge extends Plugin {
              static boolean granted(Context c) {
                  return Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(c);
              }

              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", granted(getContext()));
                  r.put("running", FloatService.running);
                  call.resolve(r);
              }

              @PluginMethod
              public void ask(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getContext().getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void start(PluginCall call) {
                  Context c = getContext();
                  if (!granted(c)) { call.reject("권한 없음"); return; }
                  try {
                      Intent i = new Intent(c, FloatService.class).setAction("start");
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), FloatService.class));
                  call.resolve();
              }

              @PluginMethod
              public void setText(PluginCall call) {
                  String t = call.getString("t", "오늘");
                  String c = call.getString("c", "");
                  getContext().getSharedPreferences("float_btn", Context.MODE_PRIVATE).edit().putString("t", t).putString("c", c).apply();
                  if (FloatService.running) {
                      try {
                          getContext().startService(new Intent(getContext(), FloatService.class).setAction("text"));
                      } catch (Exception e) {
                          // 무시
                      }
                  }
                  call.resolve();
              }

              @PluginMethod
              public void setVisible(PluginCall call) {
                  Boolean v = call.getBoolean("v", true);
                  if (FloatService.running) {
                      try {
                          getContext().startService(new Intent(getContext(), FloatService.class).setAction(v != null && v ? "show" : "hide"));
                      } catch (Exception e) {
                          // 무시
                      }
                  }
                  call.resolve();
              }
          }
          `);
          W('FloatService.java',`package __PKG__;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          public class FloatService extends Service {
              static boolean running = false;
              private WindowManager wm;
              private TextView bubble;
              private WindowManager.LayoutParams lp;

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private PendingIntent openIntent(int rc) {
                  Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("calw://open?v=today"));
                  i.setClass(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  return PendingIntent.getActivity(this, rc, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private void startFg() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("float_btn", "떠 있는 버튼", NotificationManager.IMPORTANCE_MIN);
                      ch.setShowBadge(false);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(this, "float_btn");
                  } else {
                      b = new Notification.Builder(this);
                  }
                  Intent stop = new Intent(this, FloatService.class).setAction("stop");
                  PendingIntent ps = PendingIntent.getService(this, 2, stop, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  b.setSmallIcon(getApplicationInfo().icon)
                      .setContentTitle("__NAME__ 오늘 열매 버튼이 떠 있습니다")
                      .setContentText("누르면 오늘 화면이 열립니다")
                      .setContentIntent(openIntent(1))
                      .setOngoing(true)
                      .addAction(new Notification.Action.Builder(null, "버튼 끄기", ps).build());
                  if (Build.VERSION.SDK_INT >= 34) startForeground(77, b.build(), ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(77, b.build());
              }

              private void applyText(TextView t) {
                  SharedPreferences p = getSharedPreferences("float_btn", MODE_PRIVATE);
                  String s = p.getString("t", "오늘");
                  String c = p.getString("c", "");
                  t.setText(s);
                  t.setTextSize(s.length() > 0 && Character.isDigit(s.charAt(0)) ? 19 : 13);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  int col = 0xE623397A;
                  try { if (c != null && c.length() > 0) col = Color.parseColor(c); } catch (Exception e) { /* 기본색 */ }
                  bg.setColor(col);
                  bg.setStroke(dp(2), 0xFFFFFFFF);
                  t.setBackground(bg);
              }

              private void show() {
                  if (bubble != null) { applyText(bubble); bubble.setVisibility(View.VISIBLE); return; }
                  if (Build.VERSION.SDK_INT >= 23 && !android.provider.Settings.canDrawOverlays(this)) return;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  final TextView t = new TextView(this);
                  t.setTextColor(Color.WHITE);
                  t.setTypeface(null, Typeface.BOLD);
                  t.setGravity(Gravity.CENTER);
                  applyText(t);
                  if (Build.VERSION.SDK_INT >= 21) t.setElevation(dp(6));
                  final int size = dp(56);
                  int type = Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                  lp = new WindowManager.LayoutParams(size, size, type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  final SharedPreferences p = getSharedPreferences("float_btn", MODE_PRIVATE);
                  lp.x = p.getInt("x", dp(6));
                  lp.y = p.getInt("y", dp(320));
                  t.setOnTouchListener(new View.OnTouchListener() {
                      float rx, ry;
                      int sx, sy;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = lp.x; sy = lp.y; rx = e.getRawX(); ry = e.getRawY(); moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int nx = sx + (int) (e.getRawX() - rx), ny = sy + (int) (e.getRawY() - ry);
                                  if (Math.abs(nx - sx) > dp(8) || Math.abs(ny - sy) > dp(8)) moved = true;
                                  if (moved) { lp.x = nx; lp.y = Math.max(0, ny); wm.updateViewLayout(v, lp); }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) {
                                      try { openIntent(3).send(); } catch (Exception ex) { /* 무시 */ }
                                  } else {
                                      int w = getResources().getDisplayMetrics().widthPixels;
                                      lp.x = (lp.x + size / 2 < w / 2) ? dp(4) : w - size - dp(4);
                                      wm.updateViewLayout(v, lp);
                                      p.edit().putInt("x", lp.x).putInt("y", lp.y).apply();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(t, lp);
                  bubble = t;
              }

              @Override
              public int onStartCommand(Intent i, int flags, int id) {
                  String a = i != null ? i.getAction() : null;
                  if ("stop".equals(a)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  startFg();
                  running = true;
                  if ("hide".equals(a)) {
                      if (bubble != null) bubble.setVisibility(View.GONE);
                  } else if ("text".equals(a)) {
                      if (bubble != null) applyText(bubble);
                  } else {
                      show();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (bubble != null && wm != null) {
                      try { wm.removeView(bubble); } catch (Exception e) { /* 무시 */ }
                  }
                  bubble = null;
                  super.onDestroy();
              }
          }
          `);
          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');
          if(!m.includes('FloatBridge')){m=m.replace('registerPlugin(WidgetBridge.class);','registerPlugin(WidgetBridge.class);\n        registerPlugin(FloatBridge.class);');fs.writeFileSync(ma,m)}
          const mp='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(mp,'utf8');
          if(!x.includes('.FloatService')){
            x=x.replace('</application>',`        <service android:name=".FloatService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Floating shortcut button that opens the app's today screen" />
                  </service>
              </application>`);
            for(const n of ['SYSTEM_ALERT_WINDOW','FOREGROUND_SERVICE','FOREGROUND_SERVICE_SPECIAL_USE']){const f='android.permission.'+n;if(!x.includes('"'+f+'"'))x=x.replace('</manifest>',`    <uses-permission android:name="${f}" />\n</manifest>`)}
            fs.writeFileSync(mp,x)}
          console.log('떠 있는 버튼 추가 완료:',pkg);
          FJS
