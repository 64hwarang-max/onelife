          cat > add-comm.js <<'CMX'
          // 통화·문자 기록 읽기: 통화 기록과 주고받은 문자를 관계 기록으로 넘깁니다 (직접 설치하는 APK 전용)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId;
          const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          const W=(f,s)=>fs.writeFileSync(path.join(javaDir,f),s.replace(/__PKG__/g,pkg));

          W('CommBridge.java',`package __PKG__;

          import android.Manifest;
          import android.database.Cursor;
          import android.net.Uri;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.util.HashMap;
          import org.json.JSONArray;

          @CapacitorPlugin(name = "CommBridge", permissions = {
              @Permission(strings = { Manifest.permission.READ_CALL_LOG }, alias = "calls"),
              @Permission(strings = { Manifest.permission.READ_SMS }, alias = "sms"),
              @Permission(strings = { Manifest.permission.READ_CONTACTS }, alias = "contacts") })
          public class CommBridge extends Plugin {
              private boolean has(String a) {
                  return getPermissionState(a) == PermissionState.GRANTED;
              }

              @PluginMethod
              public void check(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("calls", has("calls"));
                  r.put("sms", has("sms"));
                  r.put("contacts", has("contacts"));
                  call.resolve(r);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  String kind = call.getData().optString("kind", "calls");
                  String[] al = "sms".equals(kind) ? new String[] { "sms", "contacts" } : new String[] { "calls", "contacts" };
                  requestPermissionForAliases(al, call, "permDone");
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  check(call);
              }

              private static String key(String n) {
                  if (n == null) return "";
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < n.length(); i++) {
                      char ch = n.charAt(i);
                      if (ch >= '0' && ch <= '9') b.append(ch);
                  }
                  String d = b.toString();
                  return d.length() > 8 ? d.substring(d.length() - 8) : d;
              }

              private String lookup(HashMap<String, String> cache, String number) {
                  if (number == null || number.length() == 0 || !has("contacts")) return "";
                  String k = number;
                  if (cache.containsKey(k)) return cache.get(k);
                  String name = "";
                  Cursor c = null;
                  try {
                      Uri u = Uri.withAppendedPath(android.provider.ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number));
                      c = getContext().getContentResolver().query(u, new String[] { "display_name" }, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          String s = c.getString(0);
                          if (s != null) name = s;
                      }
                  } catch (Throwable t) {
                  } finally {
                      if (c != null) {
                          try {
                              c.close();
                          } catch (Throwable t2) {
                          }
                      }
                  }
                  cache.put(k, name);
                  return name;
              }

              @PluginMethod
              public void calls(final PluginCall call) {
                  if (!has("calls")) {
                      call.reject("통화 기록 읽기 권한이 없습니다.");
                      return;
                  }
                  final long since = call.getData().optLong("since", 0L);
                  final int limit = Math.max(1, Math.min(2000, call.getData().optInt("limit", 800)));
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          Cursor c = null;
                          try {
                              HashMap<String, String> cache = new HashMap<String, String>();
                              c = getContext().getContentResolver().query(Uri.parse("content://call_log/calls"), new String[] { "number", "type", "date", "duration", "name" }, "date >= ?", new String[] { String.valueOf(since) }, "date DESC");
                              JSArray arr = new JSArray();
                              int n = 0;
                              if (c != null) {
                                  while (c.moveToNext() && n < limit) {
                                      String num = c.getString(0);
                                      String nm = c.getString(4);
                                      if (nm == null || nm.length() == 0) nm = lookup(cache, num);
                                      JSObject o = new JSObject();
                                      o.put("number", num == null ? "" : num);
                                      o.put("type", c.getInt(1));
                                      o.put("date", c.getLong(2));
                                      o.put("duration", c.getLong(3));
                                      o.put("name", nm == null ? "" : nm);
                                      arr.put(o);
                                      n++;
                                  }
                              }
                              JSObject r = new JSObject();
                              r.put("items", arr);
                              call.resolve(r);
                          } catch (Throwable t) {
                              call.reject("통화 기록을 읽지 못했습니다: " + t);
                          } finally {
                              if (c != null) {
                                  try {
                                      c.close();
                                  } catch (Throwable t2) {
                                  }
                              }
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void msgs(final PluginCall call) {
                  if (!has("sms")) {
                      call.reject("문자 읽기 권한이 없습니다.");
                      return;
                  }
                  final long since = call.getData().optLong("since", 0L);
                  final int limit = Math.max(1, Math.min(1000, call.getData().optInt("limit", 300)));
                  final JSONArray ks = call.getData().optJSONArray("keys");
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          Cursor c = null;
                          try {
                              c = getContext().getContentResolver().query(Uri.parse("content://sms"), new String[] { "address", "body", "date", "type" }, "date >= ?", new String[] { String.valueOf(since) }, "date DESC");
                              JSArray arr = new JSArray();
                              int n = 0;
                              int total = 0;
                              if (c != null) {
                                  while (c.moveToNext() && total < 20000 && n < limit) {
                                      total++;
                                      int type = c.getInt(3);
                                      if (type != 1 && type != 2) continue;
                                      String addr = c.getString(0);
                                      if (ks != null && ks.length() > 0) {
                                          String k = key(addr);
                                          boolean hit = false;
                                          for (int i = 0; i < ks.length(); i++) {
                                              if (k.length() >= 7 && k.equals(ks.optString(i))) {
                                                  hit = true;
                                                  break;
                                              }
                                          }
                                          if (!hit) continue;
                                      }
                                      JSObject o = new JSObject();
                                      o.put("address", addr == null ? "" : addr);
                                      o.put("body", c.getString(1));
                                      o.put("date", c.getLong(2));
                                      o.put("type", type);
                                      arr.put(o);
                                      n++;
                                  }
                              }
                              JSObject r = new JSObject();
                              r.put("items", arr);
                              r.put("total", total);
                              call.resolve(r);
                          } catch (Throwable t) {
                              call.reject("문자를 읽지 못했습니다: " + t);
                          } finally {
                              if (c != null) {
                                  try {
                                      c.close();
                                  } catch (Throwable t2) {
                                  }
                              }
                          }
                      }
                  }).start();
              }
          }
          `);

          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');
          if(!m.includes('registerPlugin(CommBridge.class)')){
            const anchors=['registerPlugin(SmsBridge.class);','registerPlugin(HealthBridge.class);','registerPlugin(WatchBridge.class);','registerPlugin(BlockBridge.class);','registerPlugin(FocusBridge.class);','registerPlugin(WidgetBridge.class);'];
            const a=anchors.find(x=>m.includes(x));
            if(!a){console.error('MainActivity에 플러그인을 등록하지 못했습니다');process.exit(1)}
            m=m.replace(a,a+'\n        registerPlugin(CommBridge.class);');fs.writeFileSync(ma,m)}

          const mp='android/app/src/main/AndroidManifest.xml';let x=fs.readFileSync(mp,'utf8');
          for(const n of ['READ_CALL_LOG','READ_SMS','READ_CONTACTS']){const f='android.permission.'+n;if(!x.includes(f))x=x.replace('</manifest>',`    <uses-permission android:name="${f}" />\n</manifest>`)}
          if(!x.includes('android.hardware.telephony'))x=x.replace('</manifest>',`    <uses-feature android:name="android.hardware.telephony" android:required="false" />\n</manifest>`);
          fs.writeFileSync(mp,x);
          console.log('통화·문자 기록 읽기 추가 완료:',pkg);
          CMX
          cat > strip-comm.js <<'CMY'
          // 빌드가 실패했을 때 통화·문자 기록 부품을 빼기 위한 정리
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));const javaDir=path.join('android/app/src/main/java',...cfg.appId.split('.'));
          const f=path.join(javaDir,'CommBridge.java');if(fs.existsSync(f))fs.unlinkSync(f);
          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');m=m.replace(/\n\s*registerPlugin\(CommBridge\.class\);/,'');fs.writeFileSync(ma,m);
          const mp='android/app/src/main/AndroidManifest.xml';fs.writeFileSync(mp,fs.readFileSync(mp,'utf8').replace(/\s*<uses-permission android:name="android\.permission\.READ_CALL_LOG" \/>/,'').replace(/\s*<uses-permission android:name="android\.permission\.READ_CONTACTS" \/>/,''));
          if(!fs.existsSync(path.join(javaDir,'SmsBridge.java')))fs.writeFileSync(mp,fs.readFileSync(mp,'utf8').replace(/\s*<uses-permission android:name="android\.permission\.READ_SMS" \/>/,'').replace(/\s*<uses-feature android:name="android\.hardware\.telephony"[^>]*\/>/,''));
          console.log('통화·문자 기록 부품을 빼고 다시 빌드합니다');
          CMY
          node add-comm.js
      - name: 구글 캘린더 연동 부품 추가 (휴대폰 달력 직접 읽기·쓰기)
        run: |
          cat > add-gcal.js <<'GCJ'
          // 휴대폰 달력(구글 계정 캘린더 포함)을 직접 읽고 쓰는 부품. 외부 플러그인이 빠져도 연동되도록 앱에 직접 넣습니다.
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const pkg=cfg.appId;const javaDir=path.join('android/app/src/main/java',...pkg.split('.'));
          fs.writeFileSync(path.join(javaDir,'GCalBridge.java'),`package ${pkg};

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.CalendarContract;
          import java.util.TimeZone;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "GCalBridge", permissions = { @Permission(alias = "calendar", strings = { Manifest.permission.READ_CALENDAR, Manifest.permission.WRITE_CALENDAR }) })
          public class GCalBridge extends Plugin {
              private boolean granted() { return getPermissionState("calendar") == PermissionState.GRANTED; }
              private boolean need(PluginCall call) { if (granted()) return true; call.reject("달력 권한이 허용되지 않았습니다."); return false; }

              @PluginMethod
              public void requestFullCalendarAccess(PluginCall call) {
                  if (granted()) { JSObject r = new JSObject(); r.put("result", "granted"); call.resolve(r); return; }
                  requestPermissionForAlias("calendar", call, "permCb");
              }

              @PermissionCallback
              private void permCb(PluginCall call) {
                  JSObject r = new JSObject(); r.put("result", granted() ? "granted" : "denied"); call.resolve(r);
              }

              @PluginMethod
              public void listCalendars(PluginCall call) {
                  if (!need(call)) return;
                  JSArray a = new JSArray();
                  String[] p = { CalendarContract.Calendars._ID, CalendarContract.Calendars.CALENDAR_DISPLAY_NAME, CalendarContract.Calendars.ACCOUNT_NAME, CalendarContract.Calendars.OWNER_ACCOUNT, CalendarContract.Calendars.CALENDAR_COLOR, CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL };
                  try (Cursor c = getContext().getContentResolver().query(CalendarContract.Calendars.CONTENT_URI, p, null, null, null)) {
                      while (c != null && c.moveToNext()) {
                          JSObject o = new JSObject();
                          o.put("id", c.getString(0)); o.put("title", c.getString(1)); o.put("accountName", c.getString(2)); o.put("ownerAccount", c.getString(3));
                          o.put("color", String.format("#%06X", 0xFFFFFF & c.getInt(4)));
                          o.put("allowsContentModifications", c.getInt(5) >= CalendarContract.Calendars.CAL_ACCESS_CONTRIBUTOR);
                          a.put(o);
                      }
                  } catch (Exception e) { call.reject("달력 목록을 읽지 못했습니다: " + e.getMessage()); return; }
                  JSObject r = new JSObject(); r.put("result", a); call.resolve(r);
              }

              @PluginMethod
              public void listEventsInRange(PluginCall call) {
                  if (!need(call)) return;
                  long from = (long) (double) call.getDouble("from", 0d), to = (long) (double) call.getDouble("to", 0d);
                  Uri.Builder b = CalendarContract.Instances.CONTENT_URI.buildUpon();
                  ContentUris.appendId(b, from); ContentUris.appendId(b, to);
                  String[] p = { CalendarContract.Instances.EVENT_ID, CalendarContract.Instances.TITLE, CalendarContract.Instances.BEGIN, CalendarContract.Instances.END, CalendarContract.Instances.CALENDAR_ID, CalendarContract.Instances.ALL_DAY, CalendarContract.Instances.DESCRIPTION, CalendarContract.Instances.EVENT_LOCATION };
                  JSArray a = new JSArray();
                  try (Cursor c = getContext().getContentResolver().query(b.build(), p, null, null, CalendarContract.Instances.BEGIN + " ASC")) {
                      while (c != null && c.moveToNext()) {
                          JSObject o = new JSObject();
                          o.put("id", c.getString(0)); o.put("title", c.getString(1)); o.put("startDate", c.getLong(2)); o.put("endDate", c.getLong(3));
                          o.put("calendarId", c.getString(4)); o.put("isAllDay", c.getInt(5) == 1); o.put("description", c.getString(6)); o.put("location", c.getString(7));
                          a.put(o);
                      }
                  } catch (Exception e) { call.reject("일정을 읽지 못했습니다: " + e.getMessage()); return; }
                  JSObject r = new JSObject(); r.put("result", a); call.resolve(r);
              }

              private ContentValues vals(PluginCall call) {
                  ContentValues v = new ContentValues();
                  String cal = call.getString("calendarId");
                  if (cal != null && !cal.isEmpty()) v.put(CalendarContract.Events.CALENDAR_ID, Long.parseLong(cal));
                  if (call.getData().has("title")) v.put(CalendarContract.Events.TITLE, call.getString("title"));
                  if (call.getData().has("startDate")) v.put(CalendarContract.Events.DTSTART, (long) (double) call.getDouble("startDate"));
                  if (call.getData().has("endDate")) v.put(CalendarContract.Events.DTEND, (long) (double) call.getDouble("endDate"));
                  if (call.getData().has("description")) v.put(CalendarContract.Events.DESCRIPTION, call.getString("description"));
                  if (call.getData().has("location")) v.put(CalendarContract.Events.EVENT_LOCATION, call.getString("location"));
                  v.put(CalendarContract.Events.EVENT_TIMEZONE, TimeZone.getDefault().getID());
                  return v;
              }

              @PluginMethod
              public void createEvent(PluginCall call) {
                  if (!need(call)) return;
                  try {
                      Uri u = getContext().getContentResolver().insert(CalendarContract.Events.CONTENT_URI, vals(call));
                      if (u == null) { call.reject("일정을 만들지 못했습니다."); return; }
                      JSObject r = new JSObject(); r.put("id", u.getLastPathSegment()); call.resolve(r);
                  } catch (Exception e) { call.reject("일정을 만들지 못했습니다: " + e.getMessage()); }
              }

              @PluginMethod
              public void modifyEvent(PluginCall call) {
                  if (!need(call)) return;
                  try {
                      String id = call.getString("id");
                      ContentValues v = vals(call); v.remove(CalendarContract.Events.CALENDAR_ID);
                      int n = getContext().getContentResolver().update(ContentUris.withAppendedId(CalendarContract.Events.CONTENT_URI, Long.parseLong(id)), v, null, null);
                      if (n == 0) { call.reject("일정을 찾지 못했습니다."); return; }
                      call.resolve();
                  } catch (Exception e) { call.reject("일정을 고치지 못했습니다: " + e.getMessage()); }
              }

              @PluginMethod
              public void deleteEventsById(PluginCall call) {
                  if (!need(call)) return;
                  JSArray ids = call.getArray("ids"); JSArray ok = new JSArray(), bad = new JSArray();
                  ContentResolver cr = getContext().getContentResolver();
                  for (int i = 0; ids != null && i < ids.length(); i++) {
                      String id = ids.optString(i, "");
                      try { if (cr.delete(ContentUris.withAppendedId(CalendarContract.Events.CONTENT_URI, Long.parseLong(id)), null, null) > 0) ok.put(id); else bad.put(id); }
                      catch (Exception e) { bad.put(id); }
                  }
                  JSObject res = new JSObject(); res.put("deleted", ok); res.put("failed", bad);
                  JSObject r = new JSObject(); r.put("result", res); call.resolve(r);
              }
          }
          `);
          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');
          if(!m.includes('registerPlugin(GCalBridge.class)')){m=m.replace('registerPlugin(WidgetBridge.class);','registerPlugin(WidgetBridge.class);\n        registerPlugin(GCalBridge.class);');fs.writeFileSync(ma,m)}
          if(!m.includes('registerPlugin(GCalBridge.class)')){console.error('MainActivity에 달력 부품을 등록하지 못했습니다');process.exit(1)}
          console.log('구글 캘린더 연동 부품 추가 완료');
          GCJ
          node add-gcal.js
      - name: 서명 키 고정 (업데이트가 기존 앱 위에 설치되도록)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          VC=$(( $(date +%s) / 60 - 29000000 )); sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/" android/app/build.gradle; echo "versionCode=${VC} (시간 기준이라 항상 이전보다 큼 → 지우지 않고 덮어 설치)"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle || true
      - name: APK 빌드
        run: |
          cat > pick-strip.js <<'PKS'
          // 빌드 로그에서 실패한 부품을 찾아 그 부품만 뺍니다 (원인을 못 찾으면 덜 중요한 부품부터)
          const fs=require('fs'),path=require('path');
          const log=fs.readFileSync('build.log','utf8');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const jd=path.join('android/app/src/main/java',...cfg.appId.split('.'));
          const has=f=>fs.existsSync(path.join(jd,f));
          const parts=[
            ['health','HealthBridge.java',/HealthBridge\.java|health\.connect|connect-client|kotlinx-coroutines|Duplicate class kotlin/],
            ['watch','WatchBridge.java',/WatchBridge\.java|WatchReceiver\.java/],
            ['comm','CommBridge.java',/CommBridge\.java/],
            ['sms','SmsBridge.java',/SmsBridge\.java/],
            ['gcal','GCalBridge.java',/GCalBridge\.java/]];
          const hit=parts.find(([k,f,re])=>has(f)&&re.test(log))||parts.find(([k,f])=>has(f));
          process.stdout.write(hit?hit[0]:'');
          PKS
          cat > parts-report.js <<'PRT'
          // 최종 APK에 들어간 부품 표시 (Actions 실행 화면 요약)
          const fs=require('fs'),path=require('path');
          const cfg=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const jd=path.join('android/app/src/main/java',...cfg.appId.split('.'));
          const has=f=>fs.existsSync(path.join(jd,f))?'✅':'❌ 빠짐';
          const ma=fs.readFileSync(path.join(jd,'MainActivity.java'),'utf8');
          const rows=[['오늘 위젯','WidgetBridge'],['달력 위젯','CalBridge'],['떠 있는 버튼','FloatBridge'],['몰입 잠금','FocusBridge'],['앱 차단','BlockBridge'],['워치 알림','WatchBridge'],['헬스 커넥트','HealthBridge'],['결제 문자 읽기','SmsBridge'],['통화·문자 → 관계','CommBridge'],['구글 캘린더 (앱 내장)','GCalBridge']];
          let out='## '+cfg.appName+' APK 부품 확인\n\n| 부품 | 파일 | 등록 |\n|---|---|---|\n';
          for(const [n,c] of rows)out+=`| ${n} | ${has(c+'.java')} | ${ma.includes('registerPlugin('+c+'.class)')?'✅':'❌'} |\n`;
          const sg=fs.existsSync('android/capacitor.settings.gradle')?fs.readFileSync('android/capacitor.settings.gradle','utf8'):'';
          for(const [n,k] of [['구글 캘린더 연동','capacitor-calendar'],['파일 저장·자동 백업','capacitor-filesystem'],['공유(카톡·드라이브로 보내기)','capacitor-share'],['알림','local-notifications'],['받아쓰기','speech-recognition'],['갤러리 저장','community-media']])out+=`| ${n} | npm | ${sg.includes(k)?'✅':'❌ 빠짐'} |\n`;
          console.log(out);const s=process.env.GITHUB_STEP_SUMMARY;if(s)fs.appendFileSync(s,out);
          PRT
          set -o pipefail
          chmod +x android/gradlew
          for try in 1 2 3 4 5; do
            if (cd android && ./gradlew assembleDebug --console=plain) 2>&1 | tee build.log; then
              node parts-report.js
              exit 0
            fi
            cp build.log "build-fail-$try.log"
            echo "----- 빌드 오류 요약 -----"
            { echo "## 빌드 오류 요약 (시도 $try)"; echo '```'; grep -E "error:|What went wrong|Execution failed|Unresolved|cannot find|Could not" -A3 build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
            grep -E "error:|What went wrong" -A4 build.log | head -60 || true
            what=$(node pick-strip.js)
            if [ -z "$what" ]; then echo "::error::빌드 실패 - 더 뺄 부품이 없습니다. 위 '빌드 오류 요약'을 확인하십시오."; exit 1; fi
            echo "::warning::빌드 실패 원인 부품: $what → 이 부품만 빼고 다시 빌드합니다 (이 APK에는 해당 기능이 없습니다)"
            case "$what" in
              comm) node strip-comm.js ;;
              sms) node strip-sms.js ;;
              *) node strip.js "$what" ;;
            esac
          done
          echo "::error::빌드 실패"; exit 1
      - name: 빌드 실패 로그 올리기 (부품이 빠졌을 때만 생김)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-fail-*.log
          if-no-files-found: ignore
      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ililsaeng-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
