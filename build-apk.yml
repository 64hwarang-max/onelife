                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(it);
                      call.resolve();
                  } catch (Throwable t) {
                      try {
                          Intent it = new Intent("android.health.connect.action.HEALTH_HOME_SETTINGS");
                          it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(it);
                          call.resolve();
                      } catch (Throwable t2) {
                          call.reject("설정을 열지 못했습니다");
                      }
                  }
              }

              static double kg(Object m) {
                  for (String n : new String[] { "getKilograms", "getInKilograms" }) {
                      try { return ((Number) m.getClass().getMethod(n).invoke(m)).doubleValue(); } catch (Throwable t) { }
                  }
                  return 0;
              }

              static String exName(int t) {
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_RUNNING || t == ExerciseSessionRecord.EXERCISE_TYPE_RUNNING_TREADMILL) return "달리기";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_WALKING || t == ExerciseSessionRecord.EXERCISE_TYPE_HIKING) return "걷기";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_BIKING || t == ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY) return "자전거";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_SWIMMING_POOL || t == ExerciseSessionRecord.EXERCISE_TYPE_SWIMMING_OPEN_WATER) return "수영";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING) return "근력";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_TENNIS) return "테니스";
                  if (t == ExerciseSessionRecord.EXERCISE_TYPE_STRETCHING || t == ExerciseSessionRecord.EXERCISE_TYPE_YOGA) return "스트레칭";
                  return "기타";
              }

              @SuppressWarnings({"unchecked", "rawtypes"})
              private List readType(Class cls, Instant a, Instant b) throws Exception {
                  final HealthConnectClient c = client();
                  final ReadRecordsRequest rq = new ReadRecordsRequest(JvmClassMappingKt.getKotlinClass(cls), TimeRangeFilter.Companion.between(a, b), new HashSet<DataOrigin>(), true, 1000, null);
                  ReadRecordsResponse rs = (ReadRecordsResponse) await(new Susp() {
                      @Override
                      public Object run(Continuation k) {
                          return c.readRecords(rq, k);
                      }
                  });
                  return rs.getRecords();
              }

              @PluginMethod
              public void read(final PluginCall call) {
                  final Long s = call.getLong("start");
                  final Long e = call.getLong("end");
                  if (s == null || e == null) {
                      call.reject("기간이 없습니다");
                      return;
                  }
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          JSObject r = new JSObject();
                          Instant a = Instant.ofEpochMilli(s), b = Instant.ofEpochMilli(e);
                          JSArray sl = new JSArray(), ex = new JSArray(), wt = new JSArray();
                          StringBuilder err = new StringBuilder();
                          try {
                              for (Object o : readType(SleepSessionRecord.class, a, b)) {
                                  SleepSessionRecord x = (SleepSessionRecord) o;
                                  JSObject j = new JSObject();
                                  j.put("id", x.getMetadata().getId());
                                  j.put("s", x.getStartTime().toEpochMilli());
                                  j.put("e", x.getEndTime().toEpochMilli());
                                  j.put("src", x.getMetadata().getDataOrigin().getPackageName());
                                  sl.put(j);
                              }
                          } catch (Throwable t) {
                              err.append("수면:").append(t).append(" ");
                          }
                          try {
                              for (Object o : readType(ExerciseSessionRecord.class, a, b)) {
                                  ExerciseSessionRecord x = (ExerciseSessionRecord) o;
                                  JSObject j = new JSObject();
                                  j.put("id", x.getMetadata().getId());
                                  j.put("s", x.getStartTime().toEpochMilli());
                                  j.put("e", x.getEndTime().toEpochMilli());
                                  j.put("type", exName(x.getExerciseType()));
                                  j.put("title", x.getTitle() == null ? "" : x.getTitle());
                                  j.put("src", x.getMetadata().getDataOrigin().getPackageName());
                                  ex.put(j);
                              }
                          } catch (Throwable t) {
                              err.append("운동:").append(t).append(" ");
                          }
                          try {
                              for (Object o : readType(WeightRecord.class, a, b)) {
                                  WeightRecord x = (WeightRecord) o;
                                  JSObject j = new JSObject();
                                  j.put("t", x.getTime().toEpochMilli());
                                  j.put("kg", kg(x.getWeight()));
                                  wt.put(j);
                              }
                          } catch (Throwable t) {
                              err.append("체중:").append(t).append(" ");
                          }
                          r.put("sleep", sl);
                          r.put("ex", ex);
                          r.put("weight", wt);
                          if (err.length() > 0) r.put("error", err.toString());
                          call.resolve(r);
                      }
                  }).start();
              }
          }
          `);

          // 플러그인 등록
