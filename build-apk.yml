          W('SmsBridge.java',`package __PKG__;

          import android.Manifest;
          import android.database.Cursor;
          import android.net.Uri;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(name = "SmsBridge", permissions = { @Permission(strings = { Manifest.permission.READ_SMS }, alias = "sms") })
          public class SmsBridge extends Plugin {
              private static final String[] KEYS = { "승인", "결제", "출금", "입금", "이체", "사용", "취소", "송금", "납부" };

              private boolean ok() {
                  return getPermissionState("sms") == PermissionState.GRANTED;
              }

              @PluginMethod
              public void check(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", ok());
                  call.resolve(r);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  if (ok()) {
                      check(call);
                      return;
                  }
                  requestPermissionForAlias("sms", call, "permDone");
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  check(call);
              }

              private static boolean payLike(String b) {
                  if (b == null || b.indexOf("원") < 0) return false;
                  for (String k : KEYS) {
                      if (b.indexOf(k) >= 0) return true;
                  }
                  return false;
              }

              @PluginMethod
              public void read(final PluginCall call) {
                  if (!ok()) {
                      call.reject("문자 읽기 권한이 없습니다.");
                      return;
                  }
                  final long since = call.getData().optLong("since", 0L);
                  final int limit = Math.max(1, Math.min(1000, call.getData().optInt("limit", 500)));
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          Cursor c = null;
                          try {
                              c = getContext().getContentResolver().query(Uri.parse("content://sms/inbox"), new String[] { "_id", "address", "body", "date" }, "date >= ?", new String[] { String.valueOf(since) }, "date DESC");
                              JSArray arr = new JSArray();
                              int total = 0;
                              int n = 0;
                              if (c != null) {
                                  int ia = c.getColumnIndex("address");
                                  int ib = c.getColumnIndex("body");
                                  int id = c.getColumnIndex("date");
                                  while (c.moveToNext() && total < 5000) {
                                      total++;
                                      String body = c.getString(ib);
                                      if (!payLike(body) || n >= limit) continue;
                                      JSObject o = new JSObject();
                                      o.put("address", c.getString(ia));
                                      o.put("body", body);
                                      o.put("date", c.getLong(id));
                                      arr.put(o);
                                      n++;
                                  }
                              }
                              JSObject r = new JSObject();
                              r.put("items", arr);
                              r.put("total", total);
                              call.resolve(r);
                          } catch (Throwable t) {
                              call.reject("문자를 읽지 못했습니다: " + t);
                          } finally {
                              if (c != null) {
                                  try {
                                      c.close();
                                  } catch (Throwable t2) {
                                  }
                              }
                          }
                      }
                  }).start();
              }
          }
          `);

          // 플러그인 등록
          const ma=path.join(javaDir,'MainActivity.java');let m=fs.readFileSync(ma,'utf8');
