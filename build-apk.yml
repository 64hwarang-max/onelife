          const rg='android/build.gradle';if(fs.existsSync(rg)){let r=fs.readFileSync(rg,'utf8');if(!fs.existsSync(rg+'.hcbak'))fs.writeFileSync(rg+'.hcbak',r);r=r.replace(/com\.android\.tools\.build:gradle:8\.[0-8](\.\d+)?/,'com.android.tools.build:gradle:8.9.1');fs.writeFileSync(rg,r);console.log('AGP:',(r.match(/com\.android\.tools\.build:gradle:[\d.]+/)||[''])[0])}
