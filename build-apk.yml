      - name: 문자 읽기 추가 (결제 문자 가져오기 · 직접 설치용)
        run: |
          cat > add-sms.js <<'SMX'
          // 문자 읽기: 문자함에서 결제 문자(승인·결제·출금·입금 등)만 골라 앱으로 넘깁니다 (직접 설치하는 APK 전용)
