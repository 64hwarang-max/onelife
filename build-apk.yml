          const mp='android/app/src/main/AndroidManifest.xml';if(!fs.existsSync(path.join(javaDir,'CommBridge.java')))fs.writeFileSync(mp,fs.readFileSync(mp,'utf8').replace(/\s*<uses-permission android:name="android\.permission\.READ_SMS" \/>/,'').replace(/\s*<uses-feature android:name="android\.hardware\.telephony"[^>]*\/>/,''));
